id: "P4.1"
name: "Error message quality audit"
depends_on: []
agent_model: sonnet
isolation: sequential
judge: false

description: |
  Review every error path across all 9 MCP tools. Each error must explain
  what went wrong, why (current state), and suggest what to do instead
  (available_actions). Add parametrized tests covering all error paths
  to lock in quality.

files:
  create:
    - tests/mcp_server/test_error_quality.py
  modify: []
  affected: []

implementation:
  approach: |
    Step 1: Read all tool files to catalog every error path
    - src/mcp_server/tools/board.py
    - src/mcp_server/tools/workflow.py
    - src/mcp_server/tools/search.py
    - src/mcp_server/tools/detail.py
    - src/mcp_server/tools/manage.py
    - src/mcp_server/tools/review.py

    Step 2: For each error path, verify it returns:
    - success: false
    - message: actionable (explains what, why, what to do)
    - available_actions: non-empty list of valid next steps
    - data: includes current state context (task_id, current_status, etc.)

    Step 3: Create tests/mcp_server/test_error_quality.py with parametrized tests

    @pytest.mark.parametrize("tool_fn,kwargs,expected_msg_contains,expected_actions", [
        # vtf_task_detail — not found
        (vtf_task_detail, {"task_id": "nonexistent"}, "not found", ["vtf_search_tasks"]),
        # vtf_claim_and_start — wrong status
        # vtf_claim_and_start — tag mismatch
        # vtf_claim_and_start — deps unmet
        # vtf_report_progress — not doing
        # vtf_submit_work — not doing
        # vtf_manage_task — invalid transition
        # vtf_manage_task — unknown action
        # vtf_manage_task — create missing title
        # vtf_manage_task — create missing project
        # vtf_review_task — not in review status
        # vtf_review_task — changes_requested without reason
        # vtf_review_task — invalid decision
    ])
    def test_error_response_quality(tool_fn, kwargs, expected_msg_contains, expected_actions):
        """Every error response must be actionable with available_actions."""
        ...

    If any error path is missing actionable guidance, fix it in the tool file
    and add the test.

  constraints:
    - Parametrized test covering ALL error paths across all tools
    - Every error must have non-empty available_actions
    - Every error message must contain actionable guidance
    - If a tool's error response is inadequate, fix the tool AND add the test
    - Do NOT modify passing behavior, only error paths

  references:
    - src/mcp_server/tools/board.py
    - src/mcp_server/tools/workflow.py
    - src/mcp_server/tools/search.py
    - src/mcp_server/tools/detail.py
    - src/mcp_server/tools/manage.py
    - src/mcp_server/tools/review.py
    - docs/vtf-mcp-server-SPECIFICATION.md

acceptance_criteria:
  - "Parametrized test covers all error paths across all 9 tools"
  - "Every error response has non-empty available_actions"
  - "Every error message is actionable (what, why, what to do)"
  - "All tests pass"

test_command:
  unit: "docker compose exec api pytest tests/mcp_server/test_error_quality.py -v --tb=short"
