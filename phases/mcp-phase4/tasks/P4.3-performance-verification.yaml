id: "P4.3"
name: "Performance verification"
depends_on: []
agent_model: sonnet
isolation: sequential
judge: false

description: |
  Verify each MCP tool completes in under 500ms with a database of 100+
  tasks. Create a performance test that seeds realistic data and times
  each tool call.

files:
  create:
    - tests/mcp_server/test_performance.py
  modify: []
  affected: []

implementation:
  approach: |
    Step 1: Read all tool functions to understand their signatures

    Step 2: Create tests/mcp_server/test_performance.py

    @pytest.fixture
    def seeded_db(db):
        """Seed 100+ tasks across multiple projects, milestones, workplans."""
        - Create 2 projects, 4 workplans, 8 milestones
        - Create 120 tasks in various statuses (todo, doing, done, blocked, etc.)
        - Add specs, labels, dependencies, events, reviews
        - Return the seeded data for test assertions

    @pytest.mark.parametrize("tool_fn,kwargs", [
        (vtf_board_overview, {}),
        (vtf_board_overview, {"project_id": "<project_id>"}),
        (vtf_next_work, {}),
        (vtf_search_tasks, {"status": "todo"}),
        (vtf_search_tasks, {"query": "implement"}),
        (vtf_search_tasks, {"labels": "backend"}),
        (vtf_task_detail, {"task_id": "<task_id>"}),
    ])
    def test_tool_responds_within_500ms(seeded_db, tool_fn, kwargs):
        import time
        start = time.monotonic()
        result = tool_fn(**kwargs)
        elapsed = time.monotonic() - start
        assert elapsed < 0.5, f"{tool_fn.__name__} took {elapsed:.3f}s (limit: 0.5s)"
        # Also verify the response is valid JSON with success field
        data = json.loads(result)
        assert "success" in data

  constraints:
    - Use pytest parametrize for all read-only tools
    - Seed realistic data (100+ tasks with relationships)
    - 500ms threshold per tool call
    - Do not test write operations (claim, submit, manage) in perf tests — they
      modify state and would interfere with parametrized runs
    - Use time.monotonic() for timing

  references:
    - src/mcp_server/tools/board.py
    - src/mcp_server/tools/workflow.py
    - src/mcp_server/tools/search.py
    - src/mcp_server/tools/detail.py

acceptance_criteria:
  - "Performance test exists with 100+ seeded tasks"
  - "All read-only tools complete in under 500ms"
  - "Tests use parametrize for clean reporting"
  - "All tests pass"

test_command:
  unit: "docker compose exec api pytest tests/mcp_server/test_performance.py -v --tb=short"
