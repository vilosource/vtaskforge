id: "P5.2"
name: "Add streamable HTTP transport support to server.py"
depends_on: [P5.1]
agent_model: sonnet
isolation: sequential
judge: true

description: |
  Make server.py support both stdio and streamable-http transports,
  controlled by environment variables. Add a separate docker compose
  service (mcp) that runs the server in HTTP mode on port 8002.

files:
  create: []
  modify:
    - src/mcp_server/server.py
    - docker-compose.yml
  affected: []

implementation:
  approach: |
    Step 1: Read current server.py and docker-compose.yml

    Step 2: Update server.py to support dual transport

    Add env var configuration at the top (after django.setup()):
    - VTF_MCP_TRANSPORT: "stdio" (default) or "http"
    - VTF_MCP_HOST: "0.0.0.0" (default)
    - VTF_MCP_PORT: "8002" (default)

    Update the __main__ block:
    if __name__ == "__main__":
        transport = os.environ.get("VTF_MCP_TRANSPORT", "stdio")
        if transport == "http":
            host = os.environ.get("VTF_MCP_HOST", "0.0.0.0")
            port = int(os.environ.get("VTF_MCP_PORT", "8002"))
            mcp.settings.host = host
            mcp.settings.port = port
            mcp.run(transport="streamable-http")
        else:
            mcp.run(transport="stdio")

    Step 3: Add mcp service to docker-compose.yml

    mcp:
      build: .
      command: python src/mcp_server/server.py
      volumes:
        - ./src:/app/src
      environment:
        - VTF_MCP_TRANSPORT=http
        - VTF_MCP_HOST=0.0.0.0
        - VTF_MCP_PORT=8002
        - DATABASE_URL=postgres://vtf:vtfdev@db:5432/vtaskforge
        - DJANGO_SETTINGS_MODULE=vtaskforge.settings.dev
      ports:
        - "8002:8002"
      depends_on:
        db:
          condition: service_healthy

    Step 4: Verify HTTP transport starts
    - docker compose up -d mcp
    - curl -s http://localhost:8002/mcp -X POST should return MCP response
      (or at minimum not connection refused)

    Step 5: Write a test that verifies the server starts in HTTP mode
    Add to tests/mcp_server/test_server.py:
    - test_server_supports_http_transport_env — verify env var parsing

  constraints:
    - stdio must remain the default (backward compatible)
    - HTTP server binds to 0.0.0.0 (accessible from other containers)
    - Port 8002 to avoid conflict with Django API (8000) and dogfood (8001)
    - The mcp service shares the same image as api
    - Do not modify existing stdio behavior

  references:
    - src/mcp_server/server.py
    - docker-compose.yml

acceptance_criteria:
  - "VTF_MCP_TRANSPORT=http starts streamable HTTP server"
  - "VTF_MCP_TRANSPORT=stdio (or unset) starts stdio server"
  - "mcp service defined in docker-compose.yml on port 8002"
  - "HTTP server responds on port 8002"
  - "Existing stdio tests still pass"

test_command:
  unit: "docker compose exec api pytest tests/mcp_server/test_server.py tests/mcp_server/test_mcp_protocol.py -v --tb=short"
