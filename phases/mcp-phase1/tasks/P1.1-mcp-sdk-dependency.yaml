id: "P1.1"
name: "Add MCP SDK dependency and rebuild Docker image"
depends_on: []
agent_model: sonnet
isolation: sequential
judge: true

description: |
  Add the MCP Python SDK package to the project dependencies and rebuild
  the Docker image. This is a prerequisite for all MCP server code.
  The task includes the Docker rebuild because changing dependencies
  requires a new image — this is an environment change that must be
  part of the task, not a separate step.

files:
  create: []
  modify:
    - requirements/base.txt
  affected:
    - Dockerfile

implementation:
  approach: |
    Step 1: Read CLAUDE.md to understand the project setup and Docker workflow

    Step 2: Add the mcp package to requirements/base.txt
    - Package name on PyPI: mcp (version 1.26.0+)
    - Place it alphabetically with other dependencies
    - Do not pin a specific version unless there's a compatibility issue

    Step 3: Rebuild the Docker image
    - docker compose build api
    - If the build fails due to missing system dependencies, update the
      Dockerfile to add them and document what was needed
    - This is required because requirements changed

    Step 4: Restart services with new image
    - docker compose up -d

    Step 5: Verify the package is available
    - docker compose exec api python -c "import mcp; print('mcp OK')"
    - docker compose exec api python -c "from mcp.server.fastmcp import FastMCP; print('FastMCP OK')"

    Step 6: Run full test suite to verify no regressions
    - docker compose exec api pytest --tb=short
    - cd cli && pytest --tb=short

    Step 7: Commit the requirements change (and Dockerfile if modified)

  constraints:
    - Only add the mcp package — do not add other dependencies
    - The Docker rebuild is part of this task — do not skip it
    - All existing tests must pass after rebuild
    - If Dockerfile changes are needed, keep them minimal

  references:
    - requirements/base.txt
    - Dockerfile
    - CLAUDE.md

acceptance_criteria:
  - "mcp package listed in requirements/base.txt"
  - "docker compose build api succeeds"
  - "docker compose exec api python -c 'from mcp.server.fastmcp import FastMCP' succeeds"
  - "All existing backend tests pass (857+)"
  - "All CLI tests pass (206)"

test_command:
  full: "docker compose exec api pytest --tb=short"
  cli: "cd cli && pytest --tb=short"
