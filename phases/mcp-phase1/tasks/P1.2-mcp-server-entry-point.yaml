id: "P1.2"
name: "Create MCP server entry point with auth and response formatting"
depends_on: [P1.1]
agent_model: sonnet
isolation: sequential
judge: true

description: |
  Create the MCP server module with Django ORM integration, token-based
  authentication, and shared response formatting. This is the infrastructure
  that all MCP tools will build on. The server uses FastMCP (the high-level
  MCP SDK API) and bootstraps Django for ORM access.

files:
  create:
    - src/mcp_server/__init__.py
    - src/mcp_server/server.py
    - src/mcp_server/auth.py
    - src/mcp_server/responses.py
    - tests/mcp_server/__init__.py
    - tests/mcp_server/test_server.py
  modify: []
  affected: []

implementation:
  approach: |
    Step 1: Read CLAUDE.md and understand the project structure

    Step 2: Read the MCP server specification for response format
    - docs/vtf-mcp-server-SPECIFICATION.md section 4.1 defines the response conventions

    Step 3: Create src/mcp_server/__init__.py (empty)

    Step 4: Create src/mcp_server/server.py
    - Bootstrap Django BEFORE any Django imports:
      import os
      os.environ.setdefault("DJANGO_SETTINGS_MODULE", "vtaskforge.settings.dev")
      import django
      django.setup()
    - DJANGO_SETTINGS_MODULE must come from env var (not hardcoded) so it works
      in dev, dogfood, and production. setdefault only sets if not already set.
    - Create FastMCP server instance:
      from mcp.server.fastmcp import FastMCP
      mcp = FastMCP("vtf", instructions="vtaskforge task management server")
    - Add __main__ block:
      if __name__ == "__main__":
          mcp.run(transport="stdio")
    - Must work when run as: cd src && python -m mcp_server.server

    Step 5: Create src/mcp_server/auth.py
    - validate_token(token: str) -> User or None
    - Checks token against rest_framework.authtoken.models.Token
    - Returns the associated User if valid, None if invalid
    - get_token_from_env() -> str or None
    - Reads VTF_TOKEN environment variable
    - Tests:
      - test_auth_valid_token — create user + token, validate succeeds
      - test_auth_invalid_token — random string returns None
      - test_auth_missing_token — None input returns None

    Step 6: Create src/mcp_server/responses.py
    - success_response(data, message="", available_actions=None) -> dict
      Returns: {"success": True, "data": data, "message": message, "available_actions": available_actions or []}
    - error_response(message, code="", details=None) -> dict
      Returns: {"success": False, "error": {"code": code, "message": message, "details": details or {}}}
    - These match the format in vtf-mcp-server-SPECIFICATION.md section 4.1

    Step 7: Create tests/mcp_server/__init__.py (empty)

    Step 8: Create tests/mcp_server/test_server.py
    - test_server_creates — FastMCP("vtf") creates without error
    - test_response_envelope_success — success_response() shape matches spec
    - test_response_envelope_error — error_response() shape matches spec
    - test_response_success_defaults — empty available_actions defaults to []
    - test_response_error_defaults — empty details defaults to {}
    - test_auth_valid_token — validates real token
    - test_auth_invalid_token — rejects bad token
    - test_auth_missing_token — handles None

    Step 9: Run all tests
    - docker compose exec api pytest --tb=short
    - cd cli && pytest --tb=short

  constraints:
    - MCP server code lives in src/mcp_server/ — isolated from Django apps
    - Use FastMCP (from mcp.server.fastmcp import FastMCP), not the lowlevel Server API
    - DJANGO_SETTINGS_MODULE must be configurable via env var, not hardcoded
    - Response format must match vtf-mcp-server-SPECIFICATION.md section 4.1
    - Do not register any tools yet — that's P1.3
    - Must work when run as: cd src && python -m mcp_server.server

  references:
    - requirements/base.txt
    - src/vtaskforge/settings/base.py
    - docs/vtf-mcp-server-SPECIFICATION.md
    - src/agents/views.py

acceptance_criteria:
  - "src/mcp_server/server.py creates a FastMCP instance"
  - "src/mcp_server/auth.py validates tokens against Django authtoken"
  - "src/mcp_server/responses.py has success_response() and error_response()"
  - "Response format matches SPECIFICATION.md section 4.1"
  - "8 new tests pass (server + response + auth)"
  - "All existing tests pass"
  - "cd src && python -m mcp_server.server starts without error"

test_command:
  unit: "docker compose exec api pytest tests/mcp_server/ -v --tb=short"
  full: "docker compose exec api pytest --tb=short"
  cli: "cd cli && pytest --tb=short"
