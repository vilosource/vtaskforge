description: |
  Add three new CLI commands to vtf:
  1. vtf task events <id> — display event timeline for a task
  2. vtf workplan stats <id> — display workplan progress stats
  3. vtf phase stats <id> — display phase progress stats

  These commands consume the stats and events endpoints implemented in tasks
  3.3 and 3.5.

