  - "Active phases show a 'Complete' button"
  - "Completed phases show no action button"
  - "Clicking Activate calls POST /v1/phases/{id}/activate/ and refreshes the phase list"
  - "Clicking Complete calls POST /v1/phases/{id}/complete/ and refreshes the phase list"
  - "Buttons show loading state during API call"
  - "Buttons do not trigger card navigation"
  - "cd web && npx vitest run passes"

test_command:
  unit: "cd web && npx vitest run"
