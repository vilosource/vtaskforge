id: "1.1"
name: "Workplan model + CRUD"
depends_on: []
agent_model: sonnet
isolation: sequential

description: |
  Create the Workplan model, serializer, viewset, and wire endpoints into the
  root URL configuration. Workplan is the top-level entity — an implementation
  plan that contains phases and tasks. This task establishes the first real
  domain model and the DRF patterns that all subsequent tasks will follow.

files:
  create:
    - src/workplans/models.py
    - src/workplans/serializers.py
    - src/workplans/views.py
    - src/workplans/urls.py
    - src/workplans/apps.py
    - src/workplans/__init__.py
    - tests/workplans/__init__.py
    - tests/workplans/test_models.py
    - tests/workplans/test_api.py
  modify:
    - src/vtaskforge/urls.py

implementation:
  approach: |
    Model: Create Workplan in src/workplans/models.py inheriting from
    NanoIDMixin and TimestampMixin (from core.mixins). Fields:

    - name: CharField(max_length=255)
    - description: TextField(blank=True, default="")
    - status: CharField with choices STATUS_CHOICES = [
        ("active", "Active"),
        ("completed", "Completed"),
        ("archived", "Archived"),
      ], default="active"
    - owner: CharField(max_length=255, blank=True, default="")
    - tags: JSONField(default=list, blank=True)
    - target_date: DateTimeField(null=True, blank=True)
    - default_needs_review_before_start: BooleanField(default=False)
    - default_needs_review_on_completion: BooleanField(default=False)
    - created_by: CharField(max_length=255, blank=True, default="")

    NanoIDMixin provides: id (CharField pk, 21-char nanoid)
    TimestampMixin provides: created_at, updated_at (auto timestamps)

    App config: src/workplans/apps.py with WorkplansConfig, name="workplans".
    The app is already in INSTALLED_APPS in settings/base.py.

    Serializer: ModelSerializer in src/workplans/serializers.py. All fields
    exposed. id, created_at, updated_at are read-only.

    ViewSet: ModelViewSet in src/workplans/views.py with:
    - Standard CRUD (list, create, retrieve, partial_update)
    - No full PUT update — PATCH only (remove 'update' from allowed methods
      or override update to return 405)
    - Custom actions:
      - @action(detail=True, methods=["post"]) archive — sets status="archived"
      - @action(detail=True, methods=["post"]) complete — sets status="completed"
      - @action(detail=True, methods=["get"]) stats — returns placeholder
        stats dict (task counts will be populated in later tasks)

    URLs: src/workplans/urls.py using DRF DefaultRouter, register viewset
    with prefix "workplans". Include in vtaskforge/urls.py under "v1/".

    Wire into vtaskforge/urls.py: Add path("v1/", include("workplans.urls"))
    BEFORE the catch-all route.

  constraints:
    - Use DRF ModelSerializer and ModelViewSet, not manual serialization
    - Use DefaultRouter for URL registration
    - Status transitions (archive, complete) must validate current status
      (e.g., cannot archive an already-archived workplan)
    - Return 400 with error message for invalid status transitions
    - tags field must accept a JSON list of strings
    - Do not add authentication/permission classes yet (use DRF defaults)

  references:
    - src/core/mixins.py
    - src/core/views.py
    - src/core/apps.py
    - src/vtaskforge/urls.py
    - src/vtaskforge/settings/base.py

acceptance_criteria:
  - "python manage.py makemigrations workplans produces a migration"
  - "python manage.py migrate runs without errors"
  - "python manage.py check returns no issues"
  - "pytest tests/workplans/ passes"
  - "POST /v1/workplans/ with valid JSON returns 201"
  - "GET /v1/workplans/ returns 200 with list"
  - "GET /v1/workplans/{id} returns 200 with workplan detail"
  - "PATCH /v1/workplans/{id} returns 200 with updated fields"
  - "POST /v1/workplans/{id}/archive returns 200"
  - "POST /v1/workplans/{id}/complete returns 200"
  - "GET /v1/workplans/{id}/stats returns 200"

behavioral_spec:
  id: bs-1.1
  priority: high
  behaviors:
    - "POST /v1/workplans/ with {name, description} returns 201 with id, created_at, status=active"
    - "GET /v1/workplans/ returns 200 with a JSON list of workplans"
    - "GET /v1/workplans/{id} for existing workplan returns 200 with all fields"
    - "GET /v1/workplans/{id} for non-existent id returns 404"
    - "PATCH /v1/workplans/{id} with {name: 'new'} returns 200 with updated name"
    - "PUT /v1/workplans/{id} returns 405 Method Not Allowed"
    - "POST /v1/workplans/{id}/archive on active workplan returns 200 with status=archived"
    - "POST /v1/workplans/{id}/archive on already-archived workplan returns 400"
    - "POST /v1/workplans/{id}/complete on active workplan returns 200 with status=completed"
    - "POST /v1/workplans/{id}/complete on archived workplan returns 400"
    - "POST /v1/workplans/ with tags=['backend','security'] stores and returns tags as a list"
    - "GET /v1/workplans/{id}/stats returns 200 with a JSON object"

test_command: "pytest tests/workplans/"
