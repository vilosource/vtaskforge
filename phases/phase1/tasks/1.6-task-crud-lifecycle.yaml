  - "pytest tests/tasks/test_lifecycle.py passes"
  - "POST /v1/phases/{phase_id}/tasks with {title} returns 201 with status=draft"
  - "GET /v1/tasks/ returns 200 with list"
  - "GET /v1/tasks/{id} returns 200 with task detail"
  - "PATCH /v1/tasks/{id} with {title: 'new'} returns 200"
  - "POST /v1/tasks/{id}/submit on draft task returns 200 with status=todo"
  - "POST /v1/tasks/{id}/claim with {agent_id} on todo task returns 200 with status=doing"
  - "POST /v1/tasks/{id}/complete on doing task returns 200 with status=done"
  - "POST /v1/tasks/{id}/fail on doing task returns 200 with status=needs_attention"
  - "POST /v1/tasks/{id}/cancel on any non-terminal returns 200 with status=cancelled"
  - "Invalid transition returns 422 with INVALID_TRANSITION error code"

behavioral_spec:
  id: bs-1.6
  priority: high
  behaviors:
    - "POST /v1/phases/{phase_id}/tasks with {title: 'Test task'} returns 201 with id, status=draft, workplan auto-set from phase"
    - "GET /v1/tasks/ returns 200 with list of tasks"
    - "GET /v1/tasks/?status=draft returns only draft tasks"
    - "GET /v1/tasks/?workplan={id} returns only tasks in that workplan"
    - "GET /v1/tasks/{id} returns 200 with all task fields"
    - "PATCH /v1/tasks/{id} with {description: 'updated'} returns 200"
    - "POST /v1/tasks/{id}/submit on draft returns 200 with status=todo"
    - "POST /v1/tasks/{id}/submit on doing returns 422 INVALID_TRANSITION"
    - "POST /v1/tasks/{id}/claim with {agent_id: 'agent-1'} sets claimed_by, claimed_at, claim_expires_at"
    - "POST /v1/tasks/{id}/claim without agent_id returns 400 VALIDATION_ERROR"
    - "POST /v1/tasks/{id}/unclaim on doing task returns 200 with status=todo, claimed_by=null"
    - "POST /v1/tasks/{id}/complete on doing task returns 200 with status=done"
    - "POST /v1/tasks/{id}/fail on doing task returns 200 with status=needs_attention"
    - "POST /v1/tasks/{id}/resubmit on changes_requested with review_return_to set transitions to that status"
    - "POST /v1/tasks/{id}/resubmit on changes_requested without review_return_to returns 400"
    - "POST /v1/tasks/{id}/block on todo or doing returns 200 with status=blocked"
    - "POST /v1/tasks/{id}/unblock on blocked returns 200 with status=todo"
    - "POST /v1/tasks/{id}/defer on non-terminal returns 200 with status=deferred"
    - "POST /v1/tasks/{id}/cancel on non-terminal returns 200 with status=cancelled"
    - "POST /v1/tasks/{id}/cancel on done returns 422 INVALID_TRANSITION"
    - "POST /v1/tasks/{id}/heartbeat on doing task extends claim_expires_at"
    - "POST /v1/tasks/{id}/heartbeat on non-doing task returns 400"
    - "POST /v1/tasks/{id}/assign with {agent_id: 'agent-1'} sets assigned_to"
    - "POST /v1/tasks/{id}/unassign clears assigned_to"

