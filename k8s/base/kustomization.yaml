apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # NOTE: secrets.yaml is NOT included here. Secrets are created once
  # during initial namespace setup, not managed by kustomize (to avoid
  # overwriting environment-specific credentials on every apply).
  # See k8s/base/secrets.yaml for the template.
  - postgres.yaml
  - redis.yaml
  - vtf-api.yaml
  - vtf-celery.yaml
  - vtf-celery-beat.yaml
  - vtf-mcp.yaml
  - vtf-migrate.yaml
