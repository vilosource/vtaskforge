apiVersion: v1
kind: Service
metadata:
  name: vtf-mcp
spec:
  selector:
    app: vtf-mcp
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtf-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vtf-mcp
  template:
    metadata:
      labels:
        app: vtf-mcp
    spec:
      containers:
        - name: vtf-mcp
          image: vtf:latest
          command:
            - python
            - -c
            - "from mcp_server.server import run_server; run_server()"
          ports:
            - containerPort: 8002
          env:
            - name: VTF_MCP_TRANSPORT
              value: http
            - name: VTF_MCP_HOST
              value: "0.0.0.0"
            - name: VTF_MCP_PORT
              value: "8002"
            - name: DJANGO_SETTINGS_MODULE
              value: vtaskforge.settings.prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: CELERY_BROKER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
