apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtf-celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vtf-celery-beat
  template:
    metadata:
      labels:
        app: vtf-celery-beat
    spec:
      containers:
        - name: vtf-celery-beat
          image: vtf:latest
          command:
            - celery
            - -A
            - vtaskforge
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: vtaskforge.settings.prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: CELERY_BROKER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
