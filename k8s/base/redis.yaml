apiVersion: v1
kind: Service
metadata:
  name: vtf-redis
spec:
  selector:
    app: vtf-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtf-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vtf-redis
  template:
    metadata:
      labels:
        app: vtf-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
