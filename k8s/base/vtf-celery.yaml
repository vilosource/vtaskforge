apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtf-celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vtf-celery
  template:
    metadata:
      labels:
        app: vtf-celery
    spec:
      containers:
        - name: vtf-celery
          image: vtf:latest
          command: ["celery", "-A", "vtaskforge", "worker", "-l", "info"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: vtaskforge.settings.prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: CELERY_BROKER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: SECRET_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
