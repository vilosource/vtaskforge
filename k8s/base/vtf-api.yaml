apiVersion: v1
kind: Service
metadata:
  name: vtf-api
spec:
  selector:
    app: vtf-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtf-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vtf-api
  template:
    metadata:
      labels:
        app: vtf-api
    spec:
      containers:
        - name: vtf-api
          image: vtf:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: vtaskforge.settings.prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: CELERY_BROKER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vtf-secrets
                  key: SECRET_KEY
            - name: ALLOWED_HOSTS
              value: "localhost,127.0.0.1,vtf-api,vtf-api.vafi-system,vtf-api.vafi-system.svc.cluster.local"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
