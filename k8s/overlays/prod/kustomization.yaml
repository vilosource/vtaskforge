apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vtf-prod

resources:
  - ../../base
  - ingress.yaml
  - certificate.yaml

images:
  - name: vtf
    newName: harbor.viloforge.com/vafi/vtf
    newTag: 1d2f04b

patches:
  - target:
      kind: Deployment
      name: vtf-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "localhost,127.0.0.1,vtf-api,vtf-api.vtf-prod,vtf-api.vtf-prod.svc.cluster.local,vtf.viloforge.com"
  - target:
      kind: StatefulSet
      name: vtf-db
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
