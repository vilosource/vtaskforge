apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vtf-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vtf.dev.viloforge.com
        - vtf-mcp.dev.viloforge.com
      secretName: vtf-tls
  rules:
    - host: vtf.dev.viloforge.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vtf-api
                port:
                  number: 8000
    - host: vtf-mcp.dev.viloforge.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vtf-mcp
                port:
                  number: 8002
