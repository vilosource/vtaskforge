{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vtf.secretName" . }}
  labels:
    {{- include "vtf.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "vtf.databaseUrl" . | quote }}
  CELERY_BROKER_URL: {{ include "vtf.celeryBrokerUrl" . | quote }}
  SECRET_KEY: {{ .Values.django.secretKey | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}
{{- end -}}
