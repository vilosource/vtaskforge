{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vtf.fullname" . }}-ingress
  labels:
    {{- include "vtf.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.apiHost }}
        {{- if and .Values.mcp.enabled .Values.ingress.mcpHost }}
        - {{ .Values.ingress.mcpHost }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vtf.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
    {{- if and .Values.mcp.enabled .Values.ingress.mcpHost }}
    - host: {{ .Values.ingress.mcpHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vtf.fullname" . }}-mcp
                port:
                  number: {{ .Values.mcp.port }}
    {{- end }}
{{- end }}
