{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vtf.fullname" . }}-migrate
  labels:
    {{- include "vtf.labels" . | nindent 4 }}
    {{- include "vtf.selectorLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    # Argo CD does not honor helm.sh/hook annotations. These mirrors keep
    # the Job behaving as a hook under both helm and Argo CD: PostSync runs
    # after the Deployments roll, and BeforeHookCreation deletes the prior
    # Job so a new image tag isn't blocked by Job spec immutability.
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "vtf.labels" . | nindent 8 }}
        {{- include "vtf.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              cd /app/src
              echo "Waiting for database..."
              for i in $(seq 1 30); do
                python -c "import django; django.setup(); from django.db import connection; connection.ensure_connection()" 2>/dev/null && break
                echo "  attempt $i/30 — database not ready, waiting..."
                sleep 2
              done
              python manage.py migrate --noinput
              {{- if .Values.migrate.superuser.enabled }}
              python manage.py shell -c "
              from django.contrib.auth import get_user_model
              User = get_user_model()
              u, created = User.objects.get_or_create(
                  username='{{ .Values.migrate.superuser.username }}',
                  defaults={'is_staff': True, 'is_superuser': True},
              )
              u.set_password('{{ .Values.migrate.superuser.password }}')
              u.is_staff = True
              u.is_superuser = True
              u.save()
              print('Superuser created' if created else 'Superuser password synced')
              "
              {{- end }}
          env:
            {{- include "vtf.commonEnv" . | nindent 12 }}
{{- end }}
