{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vtf.fullname" . }}-mcp
  labels:
    {{- include "vtf.labels" . | nindent 4 }}
    {{- include "vtf.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  selector:
    {{- include "vtf.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
  ports:
    - port: {{ .Values.mcp.port }}
      targetPort: {{ .Values.mcp.port }}
{{- end }}
