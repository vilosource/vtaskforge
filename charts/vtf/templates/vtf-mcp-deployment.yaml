{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vtf.fullname" . }}-mcp
  labels:
    {{- include "vtf.labels" . | nindent 4 }}
    {{- include "vtf.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "vtf.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vtf.labels" . | nindent 8 }}
        {{- include "vtf.selectorLabels" (dict "root" . "component" "mcp") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vtf-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - "from mcp_server.server import run_server; run_server()"
          ports:
            - containerPort: {{ .Values.mcp.port }}
          env:
            - name: VTF_MCP_TRANSPORT
              value: http
            - name: VTF_MCP_HOST
              value: "0.0.0.0"
            - name: VTF_MCP_PORT
              value: {{ .Values.mcp.port | quote }}
            {{- include "vtf.commonEnv" . | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: {{ .Values.mcp.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcp.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcp.readinessProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: {{ .Values.mcp.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcp.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcp.livenessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
