# vtf Helm chart values
# See README for full documentation of all values.

# -- Container image for all vtf components (api, mcp, celery, celery-beat, migrate)
image:
  repository: vtf
  tag: latest
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override release name
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# VTF API — Django/gunicorn application server
# ---------------------------------------------------------------------------
api:
  replicas: 1
  port: 8000
  # Extra entries appended to ALLOWED_HOSTS (comma-separated).
  # Service name, namespace variants, and ingress hosts are auto-included.
  extraAllowedHosts: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# VTF MCP Server — Model Context Protocol endpoint
# ---------------------------------------------------------------------------
mcp:
  enabled: true
  replicas: 1
  port: 8002
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Celery Worker
# ---------------------------------------------------------------------------
celery:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ---------------------------------------------------------------------------
# Celery Beat — periodic task scheduler (always exactly 1 replica)
# ---------------------------------------------------------------------------
celeryBeat:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ---------------------------------------------------------------------------
# Built-in PostgreSQL — disable if using an external database
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ---------------------------------------------------------------------------
# Built-in Redis — disable if using an external broker
# ---------------------------------------------------------------------------
redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ---------------------------------------------------------------------------
# Database configuration
# When postgresql.enabled=true these configure the built-in instance.
# When postgresql.enabled=false set databaseUrl to your external database.
# ---------------------------------------------------------------------------
database:
  name: vtf
  user: vtf
  password: changeme
  # Full DATABASE_URL — auto-generated when postgresql.enabled=true.
  databaseUrl: ""

# ---------------------------------------------------------------------------
# Broker configuration
# When redis.enabled=true the URL is auto-generated.
# When redis.enabled=false set celeryBrokerUrl to your external broker.
# ---------------------------------------------------------------------------
broker:
  celeryBrokerUrl: ""

# ---------------------------------------------------------------------------
# CXDB — execution trace store (read-only consumer)
# Leave empty to use in-cluster default (cxdb-server.vafi-agents.svc.cluster.local).
# ---------------------------------------------------------------------------
cxdb:
  baseUrl: ""
  webUrl: ""

# ---------------------------------------------------------------------------
# Django settings
# ---------------------------------------------------------------------------
django:
  secretKey: "change-me-in-production"
  settingsModule: vtaskforge.settings.prod

# ---------------------------------------------------------------------------
# Migration job — runs Django migrate on install/upgrade
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  superuser:
    enabled: true
    username: admin
    password: admin

# ---------------------------------------------------------------------------
# Ingress — disabled by default (use kubectl port-forward for quick access)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  apiHost: ""
  mcpHost: ""
  tls:
    enabled: false
    secretName: vtf-tls

# ---------------------------------------------------------------------------
# cert-manager Certificate — requires cert-manager installed in cluster
# ---------------------------------------------------------------------------
certificate:
  enabled: false
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
